<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* 固定 iframe 内部 body 高度，防止 notifyLoaded 动态撑大 */
      html,
      body {
        height: 700px !important;
        max-height: 700px !important;
      }
      /* 放大模型显示：内部 840px(3x) → CSS 显示 616px → 下采样不模糊
         translateX 居中，overflow:hidden 裁剪 */
      canvas {
        width: 616px !important;
        height: auto !important;
        transform: translate(-168px, -70px);
      }
    </style>
  </head>
  <body>
    <script src="./l2d-widget.min.js"></script>
    <script>
      // 在 WebGL 上下文创建前拦截，将 canvas 内部分辨率提升到 3x
      (function () {
        var _getContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function () {
          var ctxType = arguments[0];
          if (
            (ctxType === "webgl" || ctxType === "webgl2") &&
            this.width > 0 &&
            this.height > 0 &&
            !this.dataset.l2dResized
          ) {
            this.dataset.l2dResized = "1";
            this.style.width = this.width + "px";
            this.style.height = this.height + "px";
            this.width = this.width * 3;
            this.height = this.height * 3;
          }
          return _getContext.apply(this, arguments);
        };
      })();
    </script>
    <script>
      var widgetInstance = null;
      var activeConfigKey = "";
      var loadingConfigKey = "";
      var lastContentHeight = 500;

      var menuActions = {
        home: function () {
          parent.postMessage({ type: "l2d-action", action: "home" }, "*");
        },
        scrollToTop: function () {
          parent.postMessage(
            { type: "l2d-action", action: "scrollToTop" },
            "*",
          );
        },
        sleep: function (w) {
          w.sleep();
        },
      };

      function notifyLoaded() {
        var maxBottom = 0;
        document.querySelectorAll("*").forEach(function (el) {
          if (el.getBoundingClientRect) {
            var r = el.getBoundingClientRect();
            if (r.width > 0 && r.height > 0 && r.bottom > maxBottom) {
              maxBottom = r.bottom;
            }
          }
        });

        lastContentHeight = Math.ceil(maxBottom) || lastContentHeight || 500;
        parent.postMessage(
          { type: "l2d-loaded", contentHeight: lastContentHeight },
          "*",
        );
      }

      function hideAboutMenu() {
        if (document.getElementById("l2d-hide-about")) return;
        var style = document.createElement("style");
        style.id = "l2d-hide-about";
        style.textContent =
          'button[title="About"] { display: none !important; }';
        document.head.appendChild(style);
      }

      function destroyWidget() {
        if (!widgetInstance) return;
        try {
          widgetInstance.destroy();
        } catch (err) {
          console.error("Failed to destroy Live2D widget:", err);
        }
        widgetInstance = null;
      }

      window.addEventListener("message", function (e) {
        if (e.data.type !== "l2d-init") return;
        var config = e.data.config;
        var configKey = JSON.stringify(config);

        if (widgetInstance && activeConfigKey === configKey) {
          notifyLoaded();
          return;
        }

        if (loadingConfigKey === configKey) {
          return;
        }

        loadingConfigKey = configKey;
        if (widgetInstance) {
          destroyWidget();
        }

        if (config.menus && config.menus.items) {
          config.menus.items = config.menus.items.map(function (item) {
            return {
              icon: item.icon,
              label: item.label,
              onClick: menuActions[item.action] || function () {},
            };
          });
        }

        try {
          widgetInstance = L2D_WIDGET.createWidget(config);
          activeConfigKey = configKey;
        } catch (err) {
          loadingConfigKey = "";
          activeConfigKey = "";
          console.error("Failed to initialize Live2D widget:", err);
          return;
        }
        loadingConfigKey = "";

        if (config._hideAbout) {
          hideAboutMenu();
        }

        var notified = false;
        function notifyOnce() {
          if (notified) return;
          notified = true;
          notifyLoaded();
        }

        var checkInterval = setInterval(function () {
          var canvas = document.querySelector("canvas");
          if (canvas && canvas.width > 0 && canvas.height > 0) {
            clearInterval(checkInterval);
            setTimeout(notifyOnce, 300);
          }
        }, 200);

        setTimeout(function () {
          clearInterval(checkInterval);
          loadingConfigKey = "";
          notifyOnce();
        }, 15000);
      });
    </script>
  </body>
</html>
